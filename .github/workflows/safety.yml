name: Full verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_NO_TELEMETRY: "1"
      VITE_CONFIG_NATIVE_IGNORE_WARNING: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.22.0

      - name: Scan tracked content
        run: npm run safety -- --all

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Typecheck, lint, format, and test
        working-directory: app
        run: npm run check

      - name: Export Android bundle
        working-directory: app
        run: npx expo export --platform android --output-dir /tmp/brewgo-android

      - name: Export web bundle
        working-directory: app
        run: npx expo export --platform web --output-dir /tmp/brewgo-web
