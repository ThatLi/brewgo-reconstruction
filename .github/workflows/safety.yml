name: Repository safety

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.22.0

      - name: Scan tracked content
        run: npm run safety -- --all
